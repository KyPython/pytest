name: capture-13322-spec

on:
  push:
    branches:
      - spec-capture-13322

permissions:
  contents: read

jobs:
  specification:
    if: github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]' pexpect
      - name: Verify exact intentional baseline failures and passing controls
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/validate_capture_13322_spec.py --artifacts "$RUNNER_TEMP/capture-13322-spec"
